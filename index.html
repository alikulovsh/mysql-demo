    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      width: 100%;
      max-width: 22rem;
      margin: 0;
      padding: 1.4rem 1.5rem 1.5rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      color: #e6d3c3;
      background: linear-gradient(145deg, rgba(40, 38, 62, 0.45), rgba(70, 45, 50, 0.35));
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      backdrop-filter: blur(18px) saturate(140%);
      border: 2px solid rgba(170, 180, 225, 0.4);
      border-radius: 1.4rem;
      box-shadow: 0 0 2.8rem rgba(140, 150, 220, 0.28), 0 1.1rem 3rem rgba(0, 0, 0, 0.45);
      animation: fadeUp 0.8s ease both;
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      body { background: linear-gradient(145deg, rgba(30, 28, 50, 0.88), rgba(50, 32, 38, 0.88)); }
    }

    h1 {
      order: 1;
      margin: 0;
      font-size: 1.35rem;
      font-weight: 500;
      line-height: 1.25;
      text-align: center;
      color: #e8c8b0;
    }

    h1::after {
      content: "Ism";
      display: block;
      margin-top: 0.9rem;
      font-size: 0.85rem;
      font-weight: 400;
      text-align: left;
      color: #8d8e9c;
    }

    input {
      order: 2;
      width: 100%;
      margin-top: 0.4rem;
      padding: 0.6rem 0.75rem;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 1rem;
      color: #e6d3c3;
      background: rgba(16, 18, 26, 0.85);
      border: 1px solid rgba(165, 170, 195, 0.5);
      border-radius: 0.65rem;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    input::placeholder {
      color: transparent;
    }

    input:focus {
      border-color: rgba(200, 205, 235, 0.85);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5), 0 0 0 3px rgba(140, 150, 220, 0.25);
    }

    ul {
      order: 3;
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 40vh;
      max-height: 40dvh;
      overflow-y: auto;
      overflow-wrap: anywhere;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
    }

    li {
      margin: 0;
      padding: 0.7rem 0;
      font-size: 0.95rem;
      line-height: 1.35;
      color: #eadccd;
      animation: fadeUp 0.5s ease both;
    }

    small {
      font-size: 0.95rem;
      color: #a09a9c;
    }

    button {
      order: 4;
      width: 100%;
      margin-top: 0.65rem;
      padding: 0.65rem 0.9rem;
      font-family: inherit;
      font-size: 0.95rem;
      cursor: pointer;
      color: #b9bf9f;
      background: linear-gradient(90deg, #1d2127, #4b503d);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.65rem;
      box-shadow: 0 0.3rem 0.9rem rgba(0, 0, 0, 0.45);
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.2s, filter 0.2s;
    }

    button:focus-visible {
      outline: 2px solid rgba(200, 205, 235, 0.8);
      outline-offset: 2px;
    }

    button:active {
      transform: scale(0.98);
    }

    @media (hover: hover) {
      button:hover {
        filter: brightness(1.2);
        transform: translateY(-1px);
      }
    }

    @media (max-height: 520px) {
      html { place-items: start center; }
      ul { max-height: 30vh; }
    }

    @media (max-width: 340px) {
      body { padding: 1.1rem 1rem 1.2rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      body, li { animation: none; }
      input, button { transition: none; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(0.9rem); }
      to { opacity: 1; transform: translateY(0); }
    }
  
</style>
</head>
<body>

  <h1>Ismingizni qoldiring</h1>
  <input id="name" placeholder="Ism" maxlength="100">
  <button onclick="add()">Saqlash</button>
  <ul id="list"></ul>

<script>
const API = "/.netlify/functions/api";

async function load() {
  const rows = await (await fetch(API)).json();
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  rows.forEach(r => {
    const li = document.createElement("li");
    li.textContent = r.name + " ";
    const s = document.createElement("small");
    s.textContent = "(" + new Date(r.created_at).toLocaleString() + ")";
    li.appendChild(s);
    ul.appendChild(li);
  });
}

async function add() {
  const input = document.getElementById("name");
  const name = input.value.trim();
  if (!name) return;
  await fetch(API, { method: "POST", body: JSON.stringify({ name }) });
  input.value = "";
  load();
}

load();
</script>
</body>
</html>
